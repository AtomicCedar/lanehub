name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install musl cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar czf lanehub-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release lanehub

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: lanehub-${{ matrix.target }}.tar.gz
          # Auto-notes from the x86_64 leg only; the aarch64 leg uploads its
          # asset without touching the body so notes never duplicate.
          generate_release_notes: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
          append_body: ${{ matrix.target != 'x86_64-unknown-linux-musl' }}
